name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier les vulnérabilités importantes
        run: npm audit --audit-level=high

      - name: Lancer les tests
        run: npm test

      - name: Compiler l’application
        run: npm run build
